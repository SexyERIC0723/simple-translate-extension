<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简译 - 翻译历史</title>
    <link rel="stylesheet" href="history.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>翻译历史</h1>
            <div class="actions">
                <input type="search" id="searchInput" placeholder="搜索...">
                <button id="clearBtn" class="btn-danger">清空历史</button>
            </div>
        </header>

        <div class="stats" id="stats"></div>

        <div class="history-list" id="historyList">
            <div class="placeholder">暂无翻译历史</div>
        </div>
    </div>
    <script src="history.js"></script>
</body>

</html>
